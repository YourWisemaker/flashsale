# Serves the built storefront and proxies the API on the same origin, so the
# SameSite=Strict session cookie just works. Security headers match
# apps/web/vite.config.ts (productionCsp): keep the two in sync.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Hashed build assets never change: cache them for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location ~ ^/(api|health)(/|$) {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Client-side routes (/login, /register, ...) all load index.html.
  location / {
    try_files $uri /index.html;
  }
}
