name: Release

# CD: runs only after CI passed on main (or by hand). Publishes the four
# images to GitHub Container Registry, then, if AWS is configured, deploys
# the api and worker to ECS. Without AWS settings the deploy job is skipped.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  images:
    name: Publish image (${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        target: [api, worker, web, cli]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Image name (GHCR needs lowercase)
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flashsale-${{ matrix.target }}" >> "$GITHUB_ENV"
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VITE_SITE_URL=${{ vars.PUBLIC_URL || 'http://localhost:8080' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  deploy:
    name: Deploy to AWS ECS (${{ matrix.service }})
    needs: images
    # Opt-in: set repository variables AWS_DEPLOY_ROLE_ARN, AWS_REGION,
    # ECR_REGISTRY and ECS_CLUSTER (see docs/deploy/aws.md, "CI/CD").
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    strategy:
      max-parallel: 1
      matrix:
        service: [worker, api]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - run: |
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flashsale-${{ matrix.service }}" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy the tested image into ECR
        run: |
          ECR_IMAGE="${{ vars.ECR_REGISTRY }}/flashsale-${{ matrix.service }}:$SHA"
          docker pull "$GHCR_IMAGE:$SHA"
          docker tag "$GHCR_IMAGE:$SHA" "$ECR_IMAGE"
          docker push "$ECR_IMAGE"
          echo "ECR_IMAGE=$ECR_IMAGE" >> "$GITHUB_ENV"
      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: deploy/ecs/${{ matrix.service }}-task-definition.json
          container-name: ${{ matrix.service }}
          image: ${{ env.ECR_IMAGE }}
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: flashsale-${{ matrix.service }}
          wait-for-service-stability: true
